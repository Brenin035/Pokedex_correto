<!DOCTYPE html>
<html lang="Pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" href="/favicons/favicon-16x16.png">
    <link rel="stylesheet" href="style.css">

    <script defer src="script.js"></script>

    <title>Pokedex Brenin </title>
</head>
<body>

    <main>
        <img src="#" alt="pokemon" class="pokemon_image">

        <h1 class="pokemon_data">
            <span class="pokemon_number"></span> -
            <span class="pokemon_name"></span>
        </h1>

        <form class="form">
            <input
            type="search"
            class="input_search"
            placeholder="Nome ou Numero"
            required
            />
        </form>

        <div class="buttons">
            <button class="button btn-prev">Anterior &lt;</button>
            <button class="button btn-next">Proximo &gt;</button> 
        </div>

        <img src="./images/pokedex.png" alt="Pokedex" class="Pokedex">
    </main>
    
</body>
</html>
